<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#070914"><title>Mise à jour LibreForme</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#070914;color:#edf7ff;font-family:system-ui;text-align:center}.box{padding:30px}.logo{margin:auto;width:60px;height:60px;display:grid;place-items:center;background:linear-gradient(135deg,#25f4ff,#9b5cff);color:#050712;font-weight:950;clip-path:polygon(15% 0,85% 0,100% 15%,100% 85%,85% 100%,15% 100%,0 85%,0 15%)}h1{font-size:24px;text-transform:uppercase}p{color:#8b9ab8}.bar{width:240px;height:4px;background:#18213b;margin:25px auto;overflow:hidden}.bar i{display:block;width:45%;height:100%;background:#25f4ff;box-shadow:0 0 15px #25f4ff;animation:a 1s infinite}@keyframes a{from{transform:translateX(-110%)}to{transform:translateX(240%)}}</style></head><body><div class="box"><div class="logo">LF</div><h1>Mise à jour en cours</h1><p>La nouvelle interface gaming arrive…</p><div class="bar"><i></i></div></div><script>(async()=>{try{if('serviceWorker'in navigator){const r=await navigator.serviceWorker.getRegistrations();await Promise.all(r.map(x=>x.unregister()))}if('caches'in window){const k=await caches.keys();await Promise.all(k.map(x=>caches.delete(x)))}}finally{setTimeout(()=>location.replace('./?v=6&t='+Date.now()),800)}})()</script></body></html>
